<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCart AI</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f4f5fa;color:#222}
nav{background:#5b5bf0;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav b{margin-right:auto;font-size:18px}nav a{color:#fff;cursor:pointer;padding:4px 10px;border-radius:6px}nav a:hover{background:#ffffff33}
main{max-width:1050px;margin:16px auto;padding:0 12px}.card{background:#fff;border-radius:10px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #0002}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.p{border:1px solid #e3e3ee;border-radius:8px;padding:10px;background:#fff}
input,select,textarea,button{padding:8px;margin:3px 0;width:100%;border:1px solid #ccd;border-radius:6px;font-size:14px}
button,a.btn{background:#5b5bf0;color:#fff;border:0;cursor:pointer}a.btn{display:inline-block;padding:8px 12px;border-radius:6px;margin:3px;text-decoration:none;font-size:14px}
button.sec{background:#777}button.red{background:#c0392b}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}.row.s>*{min-width:120px}
.Positive{color:#1b8a3a}.Negative{color:#c0392b}.Neutral{color:#777}.tag{display:inline-block;background:#eef;border-radius:10px;padding:2px 8px;font-size:12px;margin:2px}
.warn{background:#fff3cd}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:6px;text-align:left;font-size:13px}
.stat{text-align:center;font-size:12px}.stat h2{margin:0;color:#5b5bf0}
.hb{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}.hl{width:110px;flex:none}.ht{flex:1;background:#eceef7;border-radius:3px;height:14px}.hf{height:14px;border-radius:3px}.hv{width:72px;text-align:right;flex:none}
.stk{display:flex;overflow:hidden}.stk div{height:14px}.dn{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lg div{font-size:13px;margin:2px 0}
.lg i,.lg2 i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}.lg2 span{font-size:12px;margin-right:12px}h3{margin-top:0}
</style><link rel="stylesheet" href="/static/theme.css"></head><body>
<nav><b>🛒 SmartCart AI</b><a onclick="shop()">Shop</a><a onclick="tool()">Review AI</a><a onclick="linkTool()">🔗 Link Reviews</a><a onclick="theme()" title="Dark / Light">🌓</a><span id="nav"></span></nav>
<div id=bar></div><main id="v"></main><footer>SmartCart AI · MCA Final Year Project · Flask · scikit-learn · SQLite</footer>
<script src="/static/charts.js"></script>
<script>
const $=i=>document.getElementById(i),E=Charts.esc;let me={},LAST=null,LASTP=null,BULK=null;
const SC={Positive:'#1b8a3a',Negative:'#c0392b',Neutral:'#95a5a6'};
async function api(u,m='GET',b){bar(1);try{return await api0(u,m,b)}finally{bar(-1)}}
let busy=0;function bar(d){busy+=d;const b=$('bar');if(b)b.className=busy>0?'on':''}
async function api0(u,m,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let j;try{j=await r.json()}catch(e){throw 'Server error ('+r.status+')'}if(!r.ok)throw j.error||'error';return j}
const tryer=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e,'err')}};
const stars=n=>n?'★'.repeat(Math.round(n))+` ${n}`:'no ratings';
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n');
function dl(name,text,type='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}

function toast(m,t){let b=$('toasts');if(!b){b=document.createElement('div');b.id='toasts';document.body.appendChild(b)}const d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;b.appendChild(d);setTimeout(()=>d.remove(),3500)}
function theme(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}}
try{document.documentElement.dataset.theme=localStorage.getItem('th')||'light'}catch(e){}
const R=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const CAT={Electronics:['🎧','#4f46e5','#06b6d4'],Fashion:['👕','#ec4899','#f97316'],Home:['🛋️','#16a34a','#84cc16'],Books:['📚','#d97706','#eab308'],Beauty:['💄','#a855f7','#f43f5e'],x:['🛍️','#64748b','#94a3b8']};
const pic=c=>{const k=CAT[c]||CAT.x;return `<div class=pic style="background:linear-gradient(135deg,${k[1]},${k[2]})">${k[0]}</div>`};
async function init(){me=await api('/api/me');if(await runImport())return;if(me.name)setTimeout(refreshCart,0);$('nav').innerHTML=me.name?`<a onclick="cart()">Cart<span id=cc class=badge></span></a><a onclick="orders()">Orders</a>${me.role=='admin'?'<a onclick="admin()">Admin</a>':''}<a onclick="out()">Logout (${E(me.name)})</a>`:'<a onclick="auth()">Login / Register</a>';shop()}
async function out(){await api('/api/logout','POST');init()}
function auth(){$('v').innerHTML=`<div class="card"><h3>Login / Register</h3><input id=n placeholder="Name (register only)"><input id=e placeholder="Email"><input id=p type=password placeholder="Password (6+)"><div class=row><button onclick="login()">Login</button><button class=sec onclick="reg()">Register</button></div><small>Admin demo: admin@shop.com / admin123 &nbsp;|&nbsp; Customer demo: demo1@shop.com / demo123</small></div>`}
const login=tryer(async()=>{await api('/api/login','POST',{email:$('e').value,password:$('p').value});init()});
const reg=tryer(async()=>{await api('/api/register','POST',{name:$('n').value,email:$('e').value,password:$('p').value});toast('Registered! Now login.')});

/* ---------- shop ---------- */
async function shop(){$('v').innerHTML=`<div class=hero><h1>Smart shopping, powered by AI</h1><p>AI price trends, review intelligence and smart recommendations, all in one place.</p></div><div class="card row s"><input id=q placeholder="Search..." oninput="list()"><select id=c onchange="list()"><option value="">All</option>{% for c in cats %}<option>{{c}}</option>{% endfor %}</select><select id=s onchange="list()"><option value="">Sort</option><option value=price_asc>Price ↑</option><option value=price_desc>Price ↓</option><option value=rating>Top rated</option></select></div><div class=grid id=g></div>`;list()}
async function list(){const r=await api(`/api/products?q=${encodeURIComponent($('q').value)}&category=${$('c').value}&sort=${$('s').value}`);$('g').innerHTML=r.map(p=>`<div class=p>${pic(p.category)}<b>${E(p.name)}</b><br><span class=tag>${E(p.category)}</span><div class=pr>${R(p.price)}</div><small>${stars(p.avg_rating)} (${p.review_count})</small>${p.stock<20?`<br><span class="tag low">Only ${p.stock} left</span>`:''}<button onclick="detail(${p.id})">View</button></div>`).join('')}
const detail=tryer(async id=>{const d=await api('/api/products/'+id),p=d.product,h=d.history,n=h.length,f=d.forecast.forecast;
$('v').innerHTML=`<div class=card><h2>${E(p.name)} — ${R(p.price)}</h2><p>${E(p.description)}</p><p>${stars(p.avg_rating)} | Stock: ${p.stock}</p><button onclick="add(${p.id})">Add to cart</button></div>
<div class=row><div class=card><h3>📈 AI Price Trend: <span class=tag>${E(d.forecast.trend)}</span></h3>${Charts.line([{name:'Price history',xs:h.map((_,i)=>i),ys:h},{name:'7-day forecast',xs:[n-1,...f.map((_,i)=>n+i)],ys:[h[n-1],...f],color:'#e67e22',dash:1}],{xlabel:'Day',ylabel:'₹'})}</div>
<div class=card><h3>Review sentiment</h3>${Charts.donut(p.sentiment,{colors:SC})}</div></div>
<div class=card><h3>Write a review</h3><select id=rt><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><textarea id=rx rows=2 placeholder="Your review"></textarea><button onclick="rev(${p.id})">Submit (AI analyses it)</button><div id=ro></div></div>
<div class=card><h3>Latest reviews</h3>${d.reviews.map(r=>`<p class="${r.suspicious?'warn':''}"><b>${E(r.name)}</b> ${'★'.repeat(r.rating)} <span class=${r.sentiment}>${r.sentiment}</span> ${Object.entries(JSON.parse(r.aspects)).map(([k,v])=>`<span class=tag>${E(k)}: ${v}</span>`).join('')}${r.suspicious?` ⚠ <small>${JSON.parse(r.flags).map(E).join(', ')}</small>`:''}<br>${E(r.text)}</p>`).join('')||'No reviews yet'}</div>
${d.also_bought.length?`<div class=card><h3>🛒 Customers also bought</h3><div class=grid>${d.also_bought.map(s=>`<div class=p>${pic(s.category)}<b>${E(s.name)}</b><br>${R(s.price)}<button onclick="detail(${s.id})">View</button></div>`).join('')}</div></div>`:''}<div class=card><h3>Similar products (AI recommender)</h3><div class=grid>${d.similar.map(s=>`<div class=p><b>${E(s.name)}</b><br>${R(s.price)}<button onclick="detail(${s.id})">View</button></div>`).join('')}</div></div>`});
const add=tryer(async id=>{await api('/api/cart','POST',{product_id:id,qty:1});toast('Added to cart');refreshCart()});
const rev=tryer(async id=>{const r=await api('/api/reviews','POST',{product_id:id,rating:$('rt').value,text:$('rx').value});$('ro').innerHTML=`<p class=${r.sentiment}><b>${r.sentiment}</b> (${r.score})</p>`+(r.suspicious?`<p>⚠ Flagged: ${r.flags.join(', ')}</p>`:'');setTimeout(()=>detail(id),1800)});
const cart=tryer(async()=>{const c=await api('/api/cart');$('v').innerHTML=`<div class=card><h3>Cart</h3><table>${c.items.map(i=>`<tr><td>${E(i.name)}</td><td>${i.qty} × ${R(i.price)}</td><td><button class=red onclick="del(${i.id})">x</button></td></tr>`).join('')}</table><h3>Total ${R(c.total)}</h3><button onclick="payPage()">Proceed to Payment</button></div>`});
const del=tryer(async id=>{await api('/api/cart/'+id,'DELETE');cart()});

/* ---------- single review analyzer ---------- */

/* ---------- link / bulk reviews ---------- */
function linkTool(){BULK=null;$('v').innerHTML=`<div class=card><h3>🔎 Reviews by Product Name or Link</h3><input id=lu placeholder="Product name (e.g. boAt Airdopes 141) or a https://... link"><button onclick="lf()">Fetch & Analyze</button>
<small>Works on sites that publish structured review data in the page (many online stores, local businesses and blogs). Big sites such as Amazon and Flipkart block bots; for those, use the paste/upload option below.</small>
<h4>Or paste / upload reviews</h4><textarea id=lp rows=5 placeholder="One review per line"></textarea><input type=file id=lfile accept=".txt,.csv" onchange="loadFile(this)"><small id=lfi>Use a 'review' column and an optional 'rating' column in the CSV</small>
<button class=sec onclick="lb()">Analyze pasted / uploaded reviews</button></div>${mkCard()}<div id=lo></div>`}
const lf=async()=>{const q0=$('lu').value.trim();if(/(amazon\.|amzn\.|flipkart\.)/i.test(q0)){$('lo').innerHTML='<div class="card warn"><b>Amazon and Flipkart block automatic fetching.</b> Use the 1-click browser import in the card above: open the product reviews page in your own browser and click the bookmarklet.</div>';return}$('lo').innerHTML='<div class=card>⏳ Looking for reviews (a name search can take 10-30 seconds)...</div>';try{await(async v=>{const u=/^https?:\/\//i.test(v)||/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v);showRes(u?await api('/api/fetch_reviews','POST',{url:v}):await api('/api/search_reviews','POST',{query:v}))})($('lu').value.trim())}catch(e){$('lo').innerHTML=`<div class="card warn">⚠ ${E(e)}</div>`}};
const lb=async()=>{const items=BULK||$('lp').value.split(/\n/).filter(x=>x.trim()).map(x=>({text:x,rating:null}));$('lo').innerHTML='<div class=card>⏳ Analyzing...</div>';try{showRes(await api('/api/analyze_bulk','POST',{reviews:items}))}catch(e){$('lo').innerHTML=`<div class="card warn">⚠ ${E(e)}</div>`}};
function loadFile(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{let list;if(/\.csv$/i.test(f.name)){const rows=parseCSV(rd.result),h=rows[0].map(x=>x.toLowerCase());let ti=h.findIndex(x=>/review|text|comment|body/.test(x)),ri=h.findIndex(x=>/rating|star/.test(x));const hasH=ti>=0||ri>=0;if(ti<0)ti=0;list=rows.slice(hasH?1:0).map(r=>({text:r[ti]||'',rating:ri>=0?parseFloat(r[ri])||null:null}))}else list=rd.result.split(/\r?\n/).filter(x=>x.trim()).map(x=>({text:x,rating:null}));BULK=list.filter(x=>x.text.trim());$('lfi').textContent=BULK.length+' reviews loaded from '+f.name};rd.readAsText(f)}
function showRes(r){IMPORT_OK=true;LAST=r;if(!r.count){$('lo').innerHTML=`<div class="card warn"><b>${E(r.title||'')}</b> ${r.site_rating?`<p>Site rating: ${r.site_rating} (${r.site_count||'?'} ratings)</p>`:''}<p>${E(r.note||'No reviews found')}</p></div>`;return}
const stat=[['Reviews',r.count],['Avg rating',r.avg_rating??'-'],['Sentiment score',r.avg_score],['Suspicious',r.suspicious],['Site rating',r.site_rating?r.site_rating+' ('+(r.site_count||'?')+')':'-']];
$('lo').innerHTML=`<div class=card><h3>${E(r.title)}</h3><p><b>${E(r.verdict)}</b></p><small>${E(r.note||'')}</small><div class="row s">${stat.map(([k,v])=>`<div class=stat><h2>${E(v)}</h2>${k}</div>`).join('')}</div></div>
<div class=row><div class=card><h3>Sentiment</h3>${Charts.donut(r.sentiment,{colors:SC})}</div><div class=card><h3>Aspect-wise</h3>${Charts.stack(r.aspects,SC)}</div></div>
<div class=row><div class=card><h3>Rating distribution</h3>${Object.values(r.rating_hist).some(x=>x)?Charts.hbars(Object.entries(r.rating_hist).map(([k,v])=>[k+'★',v])):'<small>No ratings available</small>'}</div><div class=card><h3>Top words</h3>${Charts.hbars(r.top_words,{color:'#16a085'})}</div></div>
${sugg(r)}<div class=card><div class="row s"><button onclick="dlr()">⬇ Download CSV</button><button class=sec onclick="dlj()">⬇ Download JSON</button></div><table><tr><th>Review</th><th>★</th><th>Sentiment</th></tr>${r.reviews.slice(0,50).map(x=>`<tr class="${x.suspicious?'warn':''}"><td>${E(x.text.slice(0,220))}${x.suspicious?' ⚠ '+x.flags.map(E).join(', '):''}</td><td>${x.rating??''}</td><td class=${x.sentiment}>${x.sentiment}</td></tr>`).join('')}</table>${r.count>50?`<small>Showing the first 50; the CSV has all of them.</small>`:''}</div>`}
const dlr=()=>dl('reviews_analysis.csv',toCSV([['review','rating','sentiment','score','aspects','suspicious','flags'],...LAST.reviews.map(x=>[x.text,x.rating??'',x.sentiment,x.score,Object.entries(x.aspects).map(([k,v])=>k+':'+v).join('; '),x.suspicious,x.flags.join('; ')])]));
const dlj=()=>dl('reviews_analysis.json',JSON.stringify(LAST,null,2),'application/json');

/* ---------- admin ---------- */
const admin=tryer(async()=>{const s=await api('/api/admin/stats'),rd=s.revenue_by_day;
const dls=[['products','Products'],['orders','Orders'],['reviews','Reviews (+AI results)'],['price_history','Price history'],['predictions','Prediction log']];
$('v').innerHTML=`<div class="card row s"><button onclick="pricing()">🏷️ AI Pricing Optimizer →</button><button onclick="lab()">🧪 Model Lab (real-data models) →</button><button onclick="adminOrders()">📦 Orders</button></div><div class="card row s">${[['Revenue',R(s.revenue)],['Orders',s.orders],['Customers',s.customers],['Suspicious reviews',s.suspicious_reviews]].map(([a,b])=>`<div class=stat><h2>${b}</h2>${a}</div>`).join('')}</div>
<div class=row><div class=card><h3>Revenue per day</h3>${Charts.line([{name:'Revenue ₹',xs:rd.map((_,i)=>i),ys:rd.map(x=>x.rev)}],{xlabel:'Days (old → new)',ylabel:'₹'})}</div><div class=card><h3>Review sentiment</h3>${Charts.donut(s.sentiment,{colors:SC})}</div></div>
<div class=row><div class=card><h3>Category sales (₹)</h3>${Charts.hbars(s.category_sales.map(x=>[x.c,x.rev]),{colors:['#5b5bf0','#1b8a3a','#e67e22','#8e44ad','#16a085']})}</div><div class=card><h3>Top sellers (units)</h3>${Charts.hbars(s.top_products.map(x=>[x.name,x.units]),{color:'#e67e22'})}</div></div>
<div class=card><h3>🤖 AI Price Predictor</h3><div class="row s"><select id=pc>{% for c in cats %}<option>{{c}}</option>{% endfor %}</select><input id=pcost type=number value=1000 placeholder="Cost ₹"><input id=pcomp type=number value=1500 placeholder="Competitor price ₹"><input id=prate type=number step=.1 min=1 max=5 value=4 placeholder="Rating 1-5"><select id=pdem><option value=.2>Low demand</option><option value=.5 selected>Medium demand</option><option value=.9>High demand</option></select><input id=pst type=number value=50 placeholder="Stock"></div><button onclick="pp()">Predict + show charts</button><div id=po></div></div>
<div class=card><h3>⬇ Data Downloads (CSV, opens in Excel)</h3>${dls.map(([k,n])=>`<a class=btn href="/api/export/${k}.csv">${n}</a>`).join('')}</div>
<div class=row><div class=card><h3>Low stock</h3>${s.low_stock.map(t=>`<div>${E(t.name)}: <b>${t.stock}</b></div>`).join('')||'-'}</div><div class=card><h3>Recent predictions</h3><table>${s.recent_predictions.map(t=>`<tr><td>${E(t.category)}</td><td>₹${t.cost}→₹${t.competitor_price}</td><td>fair ₹${t.fair_price}</td><td>opt ₹${t.optimal_price}</td></tr>`).join('')||'<tr><td>No predictions yet</td></tr>'}</table><small>Models: price R² ${s.model_info.price_r2}, sentiment acc ${s.model_info.sentiment_acc}</small></div></div>`});
const pp=async()=>{try{const inp={category:$('pc').value,cost:$('pcost').value,competitor_price:$('pcomp').value,rating:$('prate').value,demand:$('pdem').value,stock:$('pst').value};const r=await api('/api/predict_price','POST',inp);LASTP={inp,r};const c=r.curve,cm=r.comparison,fi=Object.entries(r.feature_importance).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v*100]);
$('po').innerHTML=`<h3>Fair price: ₹${r.fair_price} <small>(margin ${r.margin_pct}%)</small> &nbsp; Profit-optimal: ₹${r.profit_optimal_price}</h3><small>Expected ${r.expected_units} units → profit ₹${r.expected_profit}</small>
<div class=row><div class=card><h3>Price comparison</h3>${Charts.hbars([['Cost',cm.cost],['Competitor',cm.competitor],['Fair (ML)',cm.fair],['Profit-optimal',cm.optimal]],{colors:['#7f8c8d','#e67e22','#5b5bf0','#1b8a3a'],fmt:v=>'₹'+Math.round(v)})}</div><div class=card><h3>What drives the price (model)</h3>${Charts.hbars(fi,{color:'#8e44ad',fmt:v=>v.toFixed(1)+'%'})}</div></div>
<div class=row><div class=card><h3>Profit vs selling price</h3>${Charts.line([{name:'Expected profit ₹',xs:c.prices,ys:c.profit,color:'#1b8a3a'}],{marks:[{x:r.profit_optimal_price,y:r.expected_profit,label:'Best ₹'+Math.round(r.profit_optimal_price)}],xlabel:'Selling price ₹',ylabel:'Profit ₹'})}</div><div class=card><h3>Demand vs selling price</h3>${Charts.line([{name:'Expected units',xs:c.prices,ys:c.units,color:'#c0392b'}],{xlabel:'Selling price ₹',ylabel:'Units'})}</div></div>
<button onclick="dlp()">⬇ Download this prediction (CSV)</button>`}catch(e){$('po').innerHTML=`<p style="color:#c0392b">⚠ ${E(e)}</p>`}};
const dlp=()=>{const{inp,r}=LASTP;dl('price_prediction.csv',toCSV([['field','value'],...Object.entries(inp),['fair_price',r.fair_price],['profit_optimal_price',r.profit_optimal_price],['expected_units',r.expected_units],['expected_profit',r.expected_profit],['margin_pct',r.margin_pct],[],['price','expected_units','expected_profit'],...r.curve.prices.map((p,i)=>[p,r.curve.units[i],r.curve.profit[i]])]))};
const pricing=tryer(async()=>{const r=await api('/api/admin/pricing');
$('v').innerHTML=`<div class=card><h3>🏷️ AI Pricing Optimizer</h3><small>For each product, the ML + profit model suggests a price from the cost, the competitor price (simulated unless you set real ones), the last 14 days of sales speed, rating and stock. Changes are limited to ±15% (safety guardrail).</small><div class="row s"><div class=stat><h2>₹${r.total_uplift}</h2>Expected profit uplift</div><div class=stat><h2>${r.rows.filter(x=>x.change_pct!=0).length}</h2>Products to change</div></div><button onclick="applyP()">Apply all suggestions</button><h4>Real competitor prices</h4><small>Edit a price in the table or upload a CSV (columns: name, competitor_price). Where none is set, a simulated price is used.</small><input type=file accept=".csv" onchange="compCSV(this)"></div>
